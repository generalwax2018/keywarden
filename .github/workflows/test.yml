name: test

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest is 26.04 and no longer has Python 3.9. 24.04 still does.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
