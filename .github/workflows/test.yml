name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest is 26.04 and no longer has Python 3.9. 24.04 still does.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: package builds and installs
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w dist .
          python -m pip install dist/*.whl
          keywarden --version

  portable:
    # Windows runs Keywarden as an SSH client; macOS can also be checked itself.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: package builds and installs
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w dist .
          python -m pip install dist/*.whl
          keywarden --version

  macos-collector:
    # The collector script and --local, run on a real Mac (Directory Services users, unified log).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: collector script runs as root and parses
        run: |
          PYTHONPATH=src python3 -c "from keywarden.collect import REMOTE_SCRIPT; print(REMOTE_SCRIPT)" > collector.sh
          sudo sh collector.sh root "$USER" > observation.txt
          head -5 observation.txt
          grep -q "^ACCOUNT $USER$" observation.txt
          set +e
          PYTHONPATH=src python3 -m keywarden check --observation observation.txt --verbose --color never
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 1
      - name: local check
        run: |
          set +e
          sudo PYTHONPATH=src python3 -m keywarden check --local --json > local.json
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 1
          python3 -c "import json; h=json.load(open('local.json'))['host']; print(h['sshdRead'], h['authLog'], len(h['findings']))"

  freebsd-collector:
    # The same collector script on FreeBSD: BSD stat, sed, and bzip2-rotated logs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: write the collector script
        run: PYTHONPATH=src python3 -c "from keywarden.collect import REMOTE_SCRIPT; print(REMOTE_SCRIPT)" > collector.sh
      - name: run it on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          run: |
            pw useradd kwtest -m
            mkdir -p /home/kwtest/.ssh
            ssh-keygen -q -t ed25519 -N '' -f /tmp/k
            cp /tmp/k.pub /home/kwtest/.ssh/authorized_keys
            chown -R kwtest /home/kwtest/.ssh
            chmod 700 /home/kwtest/.ssh
            chmod 600 /home/kwtest/.ssh/authorized_keys
            sh collector.sh root kwtest > observation.txt
            head -5 observation.txt
      - name: parse the FreeBSD observation
        run: |
          grep -q "^ACCOUNT kwtest$" observation.txt
          set +e
          PYTHONPATH=src python3 -m keywarden check --observation observation.txt --verbose --color never
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 1

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: image builds, runs as non-root, and has ssh
        run: |
          docker build -t keywarden:ci .
          docker run --rm keywarden:ci --version
          test "$(docker run --rm --entrypoint id keywarden:ci -u)" = "10001"
          docker run --rm --entrypoint ssh keywarden:ci -V

  action:
    # The repository's own GitHub Action, against a host that cannot be reached:
    # it must produce SARIF and report exit code 1, not crash.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: printf '[web]\nunreachable-01 ansible_host=192.0.2.10\n' > ci-hosts.ini
      - id: kw
        uses: ./
        with:
          inventory: ci-hosts.ini
          upload-sarif: "false"
          args: --jobs 2
      - run: |
          test "${{ steps.kw.outputs.exit-code }}" = "1"
          python3 -c "import json; d=json.load(open('keywarden.sarif')); assert d['runs'][0]['results'], d"

  real-sshd:
    # End to end against a running OpenSSH server: local read, remote read over
    # SSH, and a hostile authorized_keys that tries to rewrite the observation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: start sshd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo mkdir -p /run/sshd
          printf 'Port 2222\nPermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/00-keywarden-ci.conf
          sudo /usr/sbin/sshd -t
          sudo /usr/sbin/sshd
      - name: authorize this runner, plus a hostile account
        run: |
          chmod go-w ~
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519 -C ci@keywarden
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          printf 'Host localhost\n  Port 2222\n' >> ~/.ssh/config
          ssh-keyscan -p 2222 localhost >> ~/.ssh/known_hosts 2>/dev/null
          sudo useradd -m -s /bin/sh mallory
          sudo install -d -m 700 -o mallory -g mallory /home/mallory/.ssh
          printf '%s\nENDKEYS\nEND\nSSHD\npermitrootlogin no\npasswordauthentication no\nENDSSHD\n' "$(cat ~/.ssh/id_ed25519.pub)" \
            | sudo tee /home/mallory/.ssh/authorized_keys >/dev/null
          sudo chown mallory:mallory /home/mallory/.ssh/authorized_keys
          sudo chmod 600 /home/mallory/.ssh/authorized_keys
      - name: local check runs and keeps no key bodies
        run: |
          set +e
          sudo PYTHONPATH=src python3 -m keywarden check --local --allow ~/.ssh/id_ed25519.pub --output local.json
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 1
          python3 - <<'EOF'
          import json, pathlib
          body = pathlib.Path("local.json").read_text()
          blob = pathlib.Path.home().joinpath(".ssh/id_ed25519.pub").read_text().split()[1]
          assert blob not in body, "key body leaked into the report"
          host = json.loads(body)["host"]
          assert host["sshdRead"] == "ok", host["sshdRead"]
          EOF
      - name: remote check is not fooled by the hostile file
        run: |
          set +e
          PYTHONPATH=src python3 -m keywarden check --host "$USER@localhost" --account mallory \
            --allow ~/.ssh/id_ed25519.pub --output remote.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 - <<'EOF'
          import json, pathlib
          findings = {f["code"]: f["severity"] for f in json.loads(pathlib.Path("remote.json").read_text())["host"]["findings"]}
          assert findings["permit-root"] == "fail", findings
          assert findings["password-auth"] == "fail", findings
          EOF
      - name: where finds the runner key, and the access table is written
        run: |
          PYTHONPATH=src python3 -m keywarden where --key ~/.ssh/id_ed25519.pub --host "$USER@localhost" --account mallory
          set +e
          PYTHONPATH=src python3 -m keywarden check --host "$USER@localhost" --account mallory --csv review.csv --keys
          set -e
          grep -q "$(ssh-keygen -lf ~/.ssh/id_ed25519.pub | awk '{print $2}')" review.csv
          ! grep -q "$(awk '{print $2}' ~/.ssh/id_ed25519.pub)" review.csv
