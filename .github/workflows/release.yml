name: release

# Publishes to PyPI when a version tag is pushed, using PyPI trusted publishing:
# no API token is stored in this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Each release carries:
# - PyPI attestations (PEP 740), made by the publish action with trusted publishing
# - a GitHub build-provenance attestation for the wheel and sdist
#   (check with: gh attestation verify <file> --repo generalwax2018/keywarden)
# - the same files and their SHA-256 sums on the GitHub release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: tag matches the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: tests
        run: python -m unittest discover -s tests
      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/keywarden-ssh/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  provenance:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: GitHub release with the files and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Keywarden ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md. Verify a file: gh attestation verify <file> --repo $GITHUB_REPOSITORY" --verify-tag
