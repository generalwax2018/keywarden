[project]
name = "keywarden-ssh"
version = "0.3.1"
description = "Check SSH posture around the public keys you push. Never stores them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Michael Waxman" }]
keywords = ["ssh", "security", "authorized_keys"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/generalwax2018/keywarden"
Repository = "https://github.com/generalwax2018/keywarden"
Issues = "https://github.com/generalwax2018/keywarden/issues"
Changelog = "https://github.com/generalwax2018/keywarden/blob/main/CHANGELOG.md"

[project.scripts]
keywarden = "keywarden.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
