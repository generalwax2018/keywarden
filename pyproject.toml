[project]
name = "keywarden"
version = "0.1.0"
description = "Check SSH posture around the public keys you push. Never stores them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Michael Waxman" }]
keywords = ["ssh", "security", "authorized_keys"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/generalwax2018/keywarden"
Repository = "https://github.com/generalwax2018/keywarden"

[project.scripts]
keywarden = "keywarden.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
